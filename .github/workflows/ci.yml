name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '20'

jobs:
  governance-tests:
    name: Governance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install governance dependencies
        run: pip install -r requirements-dev.txt
      - name: Run governance tests
        run: pytest -q
      - name: Validate JSON contracts
        shell: pwsh
        run: |
          ./scripts/check-integrity.ps1
          ./scripts/mcp-tools.ps1

  # ============================================================
  # BACKEND VALIDATION
  # ============================================================
  tests-backend:
    name: Tests Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q

  build-backend:
    name: Build Backend (verify imports)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify app imports
        run: python -c "from app.main import app; print('OK')"

  quality-backend:
    name: Quality Backend (ratchets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install quality dependencies
        run: pip install -r requirements-dev.txt
      - name: Run mypy ratchet
        shell: bash
        run: |
          cp ../../mypy_baseline.txt mypy_baseline.txt
          mypy app alembic > mypy_current.txt || true
          python ../../.github/scripts/quality_ratchet_mypy.py
      - name: Run Ruff ratchet
        shell: bash
        run: |
          cp ../../ruff_baseline.json ruff_baseline.json
          ruff check . --output-format=json > ruff_current.json || true
          python ../../.github/scripts/quality_ratchet_ruff.py

  tests-postgresql:
    name: Tests PostgreSQL (migrations and RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql+psycopg://giot_app:giot_app@localhost:5432/giot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create non-superuser validation database
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE giot_app LOGIN PASSWORD 'giot_app' NOSUPERUSER NOBYPASSRLS;" \
            -c "CREATE DATABASE giot OWNER giot_app;"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Replay Alembic PostgreSQL
        run: python -m alembic upgrade head
      - name: Run migration replay tests
        run: pytest -q tests_migrations
      - name: Run RLS tests
        run: pytest -q tests_postgresql
      - name: Run functional PostgreSQL suite
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pytest -q tests

  # ============================================================
  # FRONTEND VALIDATION
  # ============================================================
  build-frontend:
    name: Build Frontend (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ============================================================
  # AGGREGATE
  # ============================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - governance-tests
      - tests-backend
      - build-backend
      - quality-backend
      - tests-postgresql
      - build-frontend
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"
