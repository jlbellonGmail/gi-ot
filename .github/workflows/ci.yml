name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # BACKEND VALIDATION
  # ============================================================
  lint-backend:
    name: Lint Backend (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff
      - name: Get baseline from develop
        run: |
          git fetch origin develop:refs/remotes/origin/develop --depth=1 2>/dev/null || true
          git show origin/develop:ruff_baseline.json > ruff_baseline.json 2>/dev/null || echo "[]" > ruff_baseline.json
      - name: Run ruff (quality ratchet)
        run: |
          ruff check . --output-format=json > ruff_current.json
          python .github/scripts/quality_ratchet_ruff.py

  tests-backend:
    name: Tests Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q

  build-backend:
    name: Build Backend (verify imports)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify app imports
        run: python -c "from app.main import app; print('OK')"

  # ============================================================
  # FRONTEND VALIDATION
  # ============================================================
  build-frontend:
    name: Build Frontend (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ============================================================
  # AGGREGATE
  # ============================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - lint-backend
      - tests-backend
      - build-backend
      - build-frontend
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"