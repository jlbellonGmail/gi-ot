name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # BACKEND VALIDATION
  # ============================================================
  lint-backend:
    name: Lint Backend (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for baseline comparison
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff
      - name: Get baseline from develop
        run: |
          git fetch origin develop:refs/remotes/origin/develop --depth=1
          git show origin/develop:apps/api/ruff_baseline.json > ruff_baseline.json 2>/dev/null || echo "[]" > ruff_baseline.json
      - name: Run ruff (quality ratchet)
        run: |
          ruff check . --output-format=json > ruff_current.json
          python -c "
import json
import sys

with open('ruff_baseline.json') as f:
    baseline = {json.dumps(e, sort_keys=True) for e in json.load(f)}

with open('ruff_current.json') as f:
    current = json.load(f)

new_errors = [e for e in current if json.dumps(e, sort_keys=True) not in baseline]

if new_errors:
    print(f'::error::Found {len(new_errors)} NEW ruff errors not in baseline:')
    for e in new_errors[:20]:
        print(f\"  {e['filename']}:{e['location']['row']}:{e['location']['column']} {e['code']} {e['message']}\")
    if len(new_errors) > 20:
        print(f'  ... and {len(new_errors) - 20} more')
    sys.exit(1)
else:
    print('✓ No new ruff errors (quality ratchet passed)')
    # Still show total for visibility
    with open('ruff_current.json') as f:
        current = json.load(f)
    print(f'  Total current errors: {len(current)} (baseline: {len(baseline)})')
  "

  typecheck-backend:
    name: Typecheck Backend (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy
      - name: Get baseline from develop
        run: |
          git fetch origin develop:refs/remotes/origin/develop --depth=1
          git show origin/develop:apps/api/mypy_baseline.txt > mypy_baseline.txt 2>/dev/null || echo "" > mypy_baseline.txt
      - name: Run mypy (quality ratchet)
        run: |
          mypy . --no-error-summary 2>&1 | tee mypy_current.txt || true
          python -c "
import sys

with open('mypy_baseline.txt') as f:
    baseline_lines = set(line.strip() for line in f if line.strip())

with open('mypy_current.txt') as f:
    current_lines = [line.strip() for line in f if line.strip() and ': error:' in line]

new_errors = [line for line in current_lines if line not in baseline_lines]

if new_errors:
    print(f'::error::Found {len(new_errors)} NEW mypy errors not in baseline:')
    for e in new_errors[:20]:
        print(f'  {e}')
    if len(new_errors) > 20:
        print(f'  ... and {len(new_errors) - 20} more')
    sys.exit(1)
else:
    print('✓ No new mypy errors (quality ratchet passed)')
    print(f'  Total current errors: {len(current_lines)} (baseline: {len(baseline_lines)})')
  "

  tests-backend:
    name: Tests Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q

  build-backend:
    name: Build Backend (verify imports)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify app imports
        run: python -c "from app.main import app; print('OK')"

  # ============================================================
  # FRONTEND VALIDATION
  # ============================================================
  lint-frontend:
    name: Lint Frontend (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run eslint
        run: npm run lint

  typecheck-frontend:
    name: Typecheck Frontend (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tsc
        run: npm run typecheck

  build-frontend:
    name: Build Frontend (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ============================================================
  # AGGREGATE
  # ============================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - lint-backend
      - typecheck-backend
      - tests-backend
      - build-backend
      - lint-frontend
      - typecheck-frontend
      - build-frontend
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"