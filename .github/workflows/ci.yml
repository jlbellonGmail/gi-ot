name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # BACKEND VALIDATION
  # ============================================================
  lint-backend:
    name: Lint Backend (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff
      - name: Run ruff (quality ratchet - allow baseline)
        run: |
          ruff check . --output-format=json > ruff_current.json
          echo "Total errors: $(jq length ruff_current.json)"

  typecheck-backend:
    name: Typecheck Backend (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy
      - name: Run mypy (quality ratchet - allow baseline)
        run: |
          mypy . 2>&1 | tee mypy_current.txt || true
          echo "Total errors: $(grep -c ': error:' mypy_current.txt || echo 0)"

  tests-backend:
    name: Tests Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q

  build-backend:
    name: Build Backend (verify imports)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify app imports
        run: python -c "from app.main import app; print('OK')"

  # ============================================================
  # FRONTEND VALIDATION
  # ============================================================
  lint-frontend:
    name: Lint Frontend (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/web
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run eslint
        run: npm run lint

  typecheck-frontend:
    name: Typecheck Frontend (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/web
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tsc
        run: npm run typecheck

  build-frontend:
    name: Build Frontend (next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/web
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ============================================================
  # AGGREGATE
  # ============================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - lint-backend
      - typecheck-backend
      - tests-backend
      - build-backend
      - lint-frontend
      - typecheck-frontend
      - build-frontend
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"