name: gi-ot-postgresql-validation

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?definir POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      GIOT_DB_NAME: ${GIOT_DB_NAME:-giot}
      GIOT_DB_USER: ${GIOT_DB_USER:-giot_app}
      GIOT_DB_PASSWORD: ${GIOT_DB_PASSWORD:?definir GIOT_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - gi_ot_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/01-create-validation-db.sh:/docker-entrypoint-initdb.d/01-create-validation-db.sh:ro

volumes:
  gi_ot_postgres_data:
